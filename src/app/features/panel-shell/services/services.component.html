<main class="page">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fs-20 mb-0">خدمات</h1>
    <button type="button" class="btn btn-primary" (click)="startCreate()">+ خدمت جدید</button>
  </div>

  @if (creating() || data()) {
    <div class="mb-4">
      <app-services-data-form
        [service]="data()"
        (saved)="onSaved()"
        (closed)="closeEditor()"
      />
    </div>
  }

  <!-- @if (services().length === 0 && !creating()) {
    <app-empty-state title="هنوز خدمتی ثبت نشده است." hint="برای شروع، یک خدمت اضافه کنید." />
  } -->

  <div class="row g-3">
    @for (s of services(); track s.id) {
      <div class="col-12">
        <article class="card h-100 p-3 rounded-4" [class.opacity-50]="!s.isActive">
          <div class="card-body d-flex flex-column">
            <div class="mb-3">
              <p class="fw-semibold mb-1">{{ s.name }}</p>
              <p class="text-body-secondary small mb-1">{{ duration(s.durationMin) }} · {{ toman(s.priceToman) }}</p>
              @if (!s.isActive) {
                <span class="badge text-bg-secondary">غیرفعال</span>
              }
            </div>

            <div class="d-flex gap-2 mt-auto">
              <button type="button" class="btn btn-outline-secondary btn-sm" (click)="startEdit(s)">ویرایش</button>
              @if (s.isActive) {
                <button type="button" class="btn btn-outline-danger btn-sm" (click)="deactivate(s)">غیرفعال</button>
              }
            </div>
          </div>
        </article>
      </div>
    }
  </div>
</main>
