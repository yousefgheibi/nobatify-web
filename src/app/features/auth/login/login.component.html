<main class="page auth-page">
  <header class="brand">
    <div class="logo" aria-hidden="true">ن</div>
    <h1>ورود به پنل</h1>
    <p class="muted">شماره موبایل و رمز عبور کسب‌وکار خود را وارد کنید.</p>
  </header>

  <form class="card form p-3 rounded-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>

    <app-input 
        label="شماره موبایل" 
        [type]="'tel'"
        [inputMode]="'tel'" 
        [dir]="'ltr'" 
        formControlName="phone" />

    <app-input
      label="رمز عبور"
      [type]="'password'"
      [dir]="'ltr'" 
      formControlName="password" />

    <button
      type="submit"
      class="btn btn-primary btn-block"
      [disabled]="form.invalid || submitting()"
    >
      {{ submitting() ? 'در حال ثبت…' : 'ثبت‌نام' }}
    </button>
  </form>

  <p class="center">حساب ندارید؟ <a routerLink="/register">ثبت‌نام کسب‌وکار</a></p>
</main>
